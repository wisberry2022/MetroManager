<style>

 #metro-more .workspace,#metro-more .desk .workspace,#metro-more .retro .workspace,#metro-more .transit .workspace {grid-template-columns:minmax(0,1fr)}

</style>
<script>
(() => {
 const root=document.getElementById('metro-more');
 const meta={model:['TABLETOP RAILWAY','철도 모형 디오라마','작은 도시를 조립하는 즐거움'],desk:['METROMANAGER / STATION OFFICE','역무실 업무 책상','지도판 · 업무철 · 회사 장부'],retro:['METROMANAGER.EXE / CITY C01','레트로 PC 경영 시뮬레이션','픽셀 도시와 정밀한 업무 도구'],transit:['C01 / METRO MANAGEMENT','공공교통 안내 디자인','큰 글자 · 노선 기호 · 명료한 안내']};
 const stops=['S01','S02','S03','S04','S08','S12'];
 const stations=Array.from({length:12},(_,i)=>{const d=i<8?i+1:i-3;return{id:'S'+String(i+1).padStart(2,'0'),x:i%4,y:Math.floor(i/4),d:'D'+String(d).padStart(2,'0'),g:'G'+String(Math.ceil(d/2)).padStart(2,'0')};});
 const funds=[['총 현금 C','1,000,000'],['제한 자금 R','0'],['자유 자금 F','1,000,000'],['공사 예약 K','0'],['약정 가용 A','1,000,000'],['운영 미지급 B','0']];
 let state={scene:'normal',focus:'S03'};
 function restore(value){const s=value?.modelContent;if(s?.task!=='DSG-006-extra')return;state.scene=s.scene==='warning'?'warning':'normal';state.focus=stations.some(p=>p.id===s.focus)?s.focus:'S03';}
 restore(window.openai?.widgetState);
 const edges=stations.flatMap(s=>{const p=`${50+s.x*100} ${50+s.y*100}`;return[(s.x<3?`<path class="edge" d="M${p} h100"/>`:''),(s.y<2?`<path class="edge" d="M${p} v100"/>`:'')];}).join('');
 const markers=stations.map(s=>{const n=stops.indexOf(s.id);return `<button type="button" class="station cursor-interaction ${n>=0?'in-plan':''}" data-station="${s.id}" style="left:${12.5+s.x*25}%;top:${(s.y+.5)/3*100}%" aria-label="${s.id}, ${s.g}, ${s.d}, ${n>=0?'계획 순서 '+(n+1):'미선택 후보'}, 정보 보기">${n>=0?(n+1)+' ':''}${s.id}</button>`;}).join('');
 const map=`<div class="map" role="group" aria-label="C01의 후보역 12개, 4열 3행의 추상 배치"><canvas class="landscape" width="400" height="300" aria-hidden="true"></canvas><svg class="net" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">${edges}<path class="rail-base" d="M50 50 H350 V250"/><path class="rail" d="M50 50 H350 V250"/></svg>${markers}<span class="district nw">G01</span><span class="district ne">G02</span><span class="district sw">G03</span><span class="district se">G04</span></div>`;
 root.querySelectorAll('[data-type]').forEach(el=>{
  const m=meta[el.dataset.type];
  el.innerHTML=`<div class="brand"><div><div class="micro">${m[0]}</div><h2>${m[1]}</h2></div><div><div class="subtitle">${m[2]}</div><div class="swatches" aria-hidden="true"><i></i><i></i><i></i></div></div></div>
  <div class="hud"><div><div class="subtitle">회사 · 시철 / 관할 · C01</div><div class="clock">1일 06:00 · 일시정지</div></div><div class="time-buttons" aria-label="시간 조작 외관 예시"><button disabled>정지</button><button disabled>재개</button><button disabled class="chosen">1×</button><button disabled>2×</button><button disabled>4×</button></div></div>
  <div class="workspace"><div class="map-window"><div class="window-title"><h3>도시 지도 · C01</h3><span>행정 레이어 / 후보 12역</span></div><div class="board">${map}</div><div class="map-caption">좌표 기반 추상 배치 · 구획은 관할 판정 도형이 아님</div><div class="map-legend"><span>번호 · 계획 순서</span><span>가는 선 · 후보 연결</span><span>굵은 선 · 계획</span><span class="lock-key" hidden>점선 · 편집 불가</span></div><div class="selection" aria-live="polite"></div></div>
  <div class="sidebar"><div class="panel"><h3>노선 계획 · P-A 예시</h3><div class="subtitle">고유 6역 / 계획 연결 확인</div><div class="route-list">${stops.map((id,i)=>`<button type="button" class="cursor-interaction" data-station="${id}" aria-label="계획 순서 ${i+1}, ${id}, 정보 보기">${String(i+1).padStart(2,'0')} · ${id}</button>`).join('')}</div><div class="edit-buttons"><button disabled>위로</button><button disabled>아래로</button><button disabled>제거</button><button disabled>되돌리기</button></div><div class="subtitle">편집 버튼 · 외관 예시</div></div>
  <div class="panel"><h3>예측 · 현재 계획</h3><p class="prediction"></p><div class="subtitle">예측과 실제 운행·실적 구분</div><div class="edit-buttons"><button disabled>예측 계산</button></div></div></div></div>
  <div class="funds"><div class="funds-title"><h3>현재 자금 · 1일 06:00</h3><span class="subtitle">게임 통화 단위 / 읽기 전용</span></div><div class="money">${funds.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div><div class="report">과거 확정 보고 · 확정 보고 없음 / 현재 자금과 별도</div></div>
  <div class="notice" aria-live="polite"></div><div class="footer"><span>DSG-006 · CONCEPT_ONLY / NON_PRODUCTION</span><span>동일 고정 데이터 · PROVISIONAL / 제품 규격 미확정</span></div>`;
  paint(el);
 });
 function paint(el){
  const canvas=el.querySelector('canvas');const c=canvas.getContext('2d');const type=el.dataset.type;
  c.imageSmoothingEnabled=false;
  if(type==='desk'){
   c.fillStyle='#b8b195';for(let x=0;x<=400;x+=20)c.fillRect(x,0,1,300);for(let y=0;y<=300;y+=20)c.fillRect(0,y,400,1);
   c.fillStyle='#cec5a9';for(let i=0;i<12;i++){let x=(i%4)*100+12,y=Math.floor(i/4)*100+18;c.fillRect(x,y,23,14);c.fillRect(x+49,y+60,22,11);}return;
  }
  if(type==='transit')return;
  c.fillStyle=type==='retro'?'#8db27a':'#b3cb91';c.fillRect(0,0,400,300);
  c.fillStyle=type==='retro'?'#849d72':'#a2bb81';for(let y=0;y<300;y+=12)for(let x=0;x<400;x+=12)if((x+y)%36===0)c.fillRect(x,y,3,3);
  c.fillStyle='#c8c5a5';for(let x=50;x<400;x+=100)c.fillRect(x-10,0,20,300);for(let y=50;y<300;y+=100)c.fillRect(0,y-9,400,18);
  c.fillStyle='#e3dec0';for(let x=50;x<400;x+=100)for(let y=0;y<300;y+=16)c.fillRect(x,y,1,8);
  for(let i=0;i<12;i++){
   let x=(i%4)*100+8,y=Math.floor(i/4)*100+10;
   c.fillStyle='#769167';c.fillRect(x+4,y+9,25,20);
   c.fillStyle=type==='retro'?'#bfc7b1':'#eee1ba';c.fillRect(x,y+6,23,19);
   c.fillStyle=['#b07552','#657f82','#927552'][i%3];c.fillRect(x-2,y,27,8);c.fillRect(x+2,y-3,19,3);
   c.fillStyle='#5a7066';c.fillRect(x+4,y+11,4,5);c.fillRect(x+14,y+11,4,5);
   c.fillStyle='#557c51';c.fillRect(x+68,y+67,9,10);c.fillRect(x+65,y+71,15,6);c.fillStyle='#6a6246';c.fillRect(x+71,y+77,3,5);
   if(type==='model'){c.fillStyle='#f1e5bd';c.fillRect(x+63,y+12,17,12);c.fillStyle='#72878b';c.fillRect(x+61,y+8,21,6);}
  }
 }
 function render(){
  const warning=state.scene==='warning';const s=stations.find(p=>p.id===state.focus);
  root.querySelectorAll('[data-case]').forEach(b=>{const active=b.dataset.case===state.scene;b.setAttribute('aria-pressed',String(active));b.classList.toggle('btn-primary',active);});
  root.querySelectorAll('.product').forEach(el=>{
   el.querySelector('.map').classList.toggle('locked',warning);el.querySelector('.lock-key').hidden=!warning;
   el.querySelectorAll('[data-station]').forEach(b=>{const selected=b.dataset.station===state.focus;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});
   el.querySelector('.selection').innerHTML=`<strong>정보 선택 · ${s.id}</strong><span>P01 &gt; C01 &gt; ${s.g} &gt; ${s.d} &gt; ${s.id}</span>`;
   el.querySelector('.prediction').textContent=warning?'! 예측 조회 실패 · 현재값 확인 불가':'자료 없음 · 아직 계산하지 않음';
   const notice=el.querySelector('.notice');notice.classList.toggle('warning',warning);
   notice.innerHTML=warning?'<strong>! 편집 불가 · 최신 허용 상태를 확인할 수 없음</strong>다음 행동 · 최신 상태 재조회 / 역 정보 열람 유지 / 과거 명령 결과 · 없음':'<strong>계획 편집 단계 · 사업 계약·개통 상태와 구분</strong>다음 행동 · 역 정보 확인 / 과거 명령 결과 · 없음';
  });
 }
 function persist(){window.openai?.setWidgetState?.({modelContent:{task:'DSG-006-extra',scene:state.scene,focus:state.focus},privateContent:null}).catch(()=>{});}
 root.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{state.scene=b.dataset.case;render();persist();}));
 root.querySelectorAll('[data-station]').forEach(b=>b.addEventListener('click',()=>{state.focus=b.dataset.station;render();persist();}));
 window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
 render();
 if(globalThis.Tweak){root.querySelectorAll('.product').forEach(el=>{const design={detail:true};const tweak=new Tweak({container:el,onChange:()=>el.style.setProperty('--detail',design.detail?'1':'0')});tweak.addToggle(design,'detail',{label:'지도 배경 디테일'});});}
})();
</script>
